name: Service platforms

on:
  push:
  pull_request:

jobs:
  services:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --extra test
      - run: uv run pytest tests/test_services.py tests/test_cli.py -q
